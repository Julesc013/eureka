schema_version = "0.1.0"
contract_id = "eureka.repo.naming.v0"
created_by_task = "REPO-LAYOUT-CANON-01"
status = "draft_canon"
description = "Repository naming canon for active source paths and documented ecosystem exceptions."

[directories]
default_style = "lowercase_ascii_stable_nouns"
separator = "_"
allow_dot_roots = true
forbid_spaces = true
forbid_root_src = true
forbid_unclassified_nested_src = true

forbidden_vague_terms = [
  "core",
  "common",
  "shared",
  "misc",
  "lib",
  "utils",
  "data",
]

forbidden_status_terms = [
  "legacy",
  "modern",
  "old",
  "new",
  "future",
  "experimental",
  "compat",
  "universal",
  "temp",
  "tmp",
]

allowed_vague_term_exceptions = [
  "runtime/engine/core",
  "runtime/connectors/core",
  "examples/connectors/core",
  "native/lib",
  "surfaces/native/shared",
]

allowed_status_term_exceptions = [
  ".aide/compat",
  "contracts/archive",
  "docs/architecture/COMPATIBILITY_SURFACES.md",
  "docs/compatibility",
  "archive/legacy",
]

allowed_src_exceptions = [
  "crates/*/src/**",
  "native/lib/c89/src/**",
  "native/mac/appkit/src/**",
  "native/mac/carbon/src/**",
  "native/win/win32/src/**",
  "native/win/winforms/src/**",
]

[files]
default_style = "lower_snake_case.ext"
conventional_root_files = [
  ".dockerignore",
  ".gitignore",
  "AGENTS.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "Dockerfile",
  "README.md",
  "SECURITY.md",
]
authority_suffixes = [
  ".schema.json",
  ".schema.yaml",
  ".registry.json",
  ".manifest.json",
  ".contract.toml",
  ".policy.toml",
  ".matrix.toml",
  ".lock.json",
  ".proof.json",
  ".report.md",
  ".report.json",
  ".audit.md",
  ".audit.json",
]

[singular_plural]
rule = "singular for one subsystem or authority plane; plural for many peer artifacts or collections"
known_allowed_pairs = [
  "runtime/source_registry vs contracts/sources",
  "runtime/search_need vs examples/search_needs",
  "runtime/engine/store vs contracts/stores",
]
