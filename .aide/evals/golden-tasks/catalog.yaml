schema_version: aide.golden-tasks-catalog.v0
catalog_id: q15-golden-tasks-v0
status: active-pending-review
purpose: Deterministic repo-local quality gates for AIDE token-saving workflow artifacts.
runner: .aide/scripts/aide_lite.py eval run
tasks:
  - id: compact-task-packet-required-sections
    title: Compact Task Packet Required Sections
    status: active
    description: Verify latest task packet keeps required sections, forbids full-history prompts, and includes an approximate token estimate.
    quality_dimensions:
      - required_sections
      - forbidden_content_absent
      - token_budget_status
  - id: context-packet-no-full-repo-dump
    title: Context Packet No Full Repo Dump
    status: active
    description: Verify latest context packet references repo-map, test-map, and context-index without inlining source files or ignored path contents.
    quality_dimensions:
      - references_present
      - forbidden_content_absent
      - deterministic_output
  - id: verifier-detects-bad-evidence
    title: Verifier Detects Bad Evidence
    status: active
    description: Verify malformed evidence fixtures produce verifier warnings or errors instead of being accepted silently.
    quality_dimensions:
      - verifier_passes
      - evidence_present
  - id: review-packet-evidence-only
    title: Review Packet Evidence Only
    status: active
    description: Verify latest review packet references task, context, verifier, and evidence outputs and requests a bounded decision without requiring full chat history.
    quality_dimensions:
      - references_present
      - required_sections
      - forbidden_content_absent
  - id: token-ledger-budget-check
    title: Token Ledger Budget Check
    status: active
    description: Verify token ledger/report metadata exists, records compact surfaces, includes budget status, and stores no raw prompts or responses.
    quality_dimensions:
      - token_budget_status
      - evidence_present
      - forbidden_content_absent
  - id: adapter-managed-section-determinism
    title: Adapter Managed Section Determinism
    status: active
    description: Verify managed AGENTS guidance can be rendered deterministically without deleting manual content outside generated markers.
    quality_dimensions:
      - deterministic_output
      - references_present
  - id: repo_boundary_golden
    title: Eureka Repo Boundary Golden
    status: active
    description: Verify AIDE-only Eureka tasks preserve product/runtime boundaries and keep product paths forbidden unless explicitly scoped.
    quality_dimensions:
      - eureka_boundaries
      - allowed_forbidden_paths
      - no_product_behavior_change
  - id: compact_task_packet_golden
    title: Eureka Compact Task Packet Golden
    status: active
    description: Verify the latest task packet is target-specific, compact, actionable, and cites Eureka context, validation, evidence, and acceptance surfaces.
    quality_dimensions:
      - required_sections
      - eureka_context_refs
      - validation_commands
      - token_budget_status
  - id: evidence_review_packet_golden
    title: Eureka Evidence Review Packet Golden
    status: active
    description: Verify review packets stay evidence-only, compact, decision-oriented, and free of raw prompts, raw responses, provider keys, or full dumps.
    quality_dimensions:
      - evidence_refs
      - required_sections
      - forbidden_content_absent
      - token_budget_status
  - id: no_secret_or_local_state_golden
    title: Eureka No Secret Or Local State Golden
    status: active
    description: Verify AIDE Lite keeps `.aide.local/`, `.env`, provider keys, raw prompts, raw responses, and local state out of committed artifacts.
    quality_dimensions:
      - local_state_boundary
      - secret_scan
      - forbidden_content_absent
  - id: eureka_architecture_context_golden
    title: Eureka Architecture Context Golden
    status: active
    description: Verify AIDE Lite context surfaces Eureka architecture boundaries, repo-map metadata, test/eval lanes, and AIDE non-ownership of product semantics.
    quality_dimensions:
      - eureka_boundaries
      - context_refs
      - architecture_validation_refs
  - id: generated_agent_guidance_golden
    title: Eureka Generated Agent Guidance Golden
    status: active
    description: Verify generated and maintained agent guidance is deterministic, compact, and aligned with Eureka AIDE Lite token and safety rules.
    quality_dimensions:
      - deterministic_output
      - agent_guidance
      - token_discipline
  - id: commit_message_standard_golden
    title: Eureka Commit Message Standard Golden
    status: active
    description: Verify AIDE enforces changelog-ready Conventional Commit subjects with structured Markdown bodies.
    quality_dimensions:
      - deterministic_output
      - changelog_ready_commits
      - validation_evidence
  - id: task_resumption_standard_golden
    title: Eureka Task Resumption Standard Golden
    status: active
    description: Verify AIDE tasks can be resumed, repeated, or reconciled from repo-local queue/evidence before user escalation.
    quality_dimensions:
      - task_resumability
      - queue_integrity
      - evidence_before_escalation
