schema_version: aide.queue-task.v0
id: EUREKA-AIDE-SYNC-01
title: Eureka sync from canonical AIDE Lite Pack
status: needs_review
created_at: 2026-05-14
owner: Codex
purpose: >
  Synchronize Eureka's target-local AIDE Lite governance from the canonical
  Q31 AIDE Lite Pack while preserving Eureka memory, queue, evidence, context,
  product boundaries, and target-specific golden tasks.
scope:
  allowed_paths:
    - .aide/**
    - .gitignore
    - AGENTS.md
    - README.md
    - docs/reference/aide-handover.md
    - docs/reference/aide-governance-sync.md
  forbidden_paths:
    - .git/**
    - .env
    - secrets/**
    - .aide.local/**
    - runtime/**
    - contracts/**
    - surfaces/**
    - site/**
    - native/**
    - crates/**
    - tests/**
    - control/**
validation:
  required:
    - py -3 .aide/scripts/aide_lite.py validate
    - py -3 .aide/scripts/aide_lite.py test
    - py -3 .aide/scripts/aide_lite.py selftest
    - py -3 .aide/scripts/aide_lite.py eval run
    - py -3 scripts/check_architecture_boundaries.py
review_gate:
  required: true
  terminal_status: needs_review
non_goals:
  - no Eureka product feature work
  - no branch mutation
  - no provider/model/network calls
  - no hook auto-install
  - no AIDE source repo mutation
