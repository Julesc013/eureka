successor: DISCOVERY-BROKER-LIVE-CANARY-00
purpose: >-
  Replace Brave-specific live gating with provider-neutral planning, active
  health state classification, progressive fanout, cost/yield accounting, and
  policy-preserving lead fusion across the existing local, Internet Archive
  metadata, and broad-web provider paths.
scope:
  - DiscoveryBroker plans local-first, vertical-first, and broad-web stages by deterministic intent
  - DiscoveryBroker can execute bounded provider stages and fuse transient leads without owning fetch, index, or review logic
  - provider health distinguishes configured credentials from checked/healthy/auth-failed/rate-limited states
  - CLI provider status/check and canary preflight support provider auto mode
  - live acceptance requires at least one configured approved broad-web provider, not Brave specifically
  - Google Custom Search JSON and direct Bing Search API are marked deprecated for new integration
non_goals:
  - no public live fanout
  - no public launch
  - no reviewed/master/public truth mutation
  - no provider-result payload persistence
  - no agentic planner
  - no broad provider pack expansion
