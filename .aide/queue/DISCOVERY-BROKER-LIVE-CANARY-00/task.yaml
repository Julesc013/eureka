schema_version: aide.task.v0
id: DISCOVERY-BROKER-LIVE-CANARY-00
title: Run the provider-neutral live Search/Hunt canary
status: WAITING_FOR_DISCOVERY_BROKER_LIVE_CANARY
task_class: operator_live_gate
