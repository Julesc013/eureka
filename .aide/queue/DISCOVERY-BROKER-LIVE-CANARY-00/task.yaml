  - reviewed_master_mutation false
  - public_index_mutation false
preflight_command: >-
  python scripts/eureka.py --instance ..\instances\live-acceptance canary
  preflight --provider auto --live-check --json
required_command: >-
  python scripts/check_live_search_hunt_acceptance.py --live-canary --query
  "<operator unseen query>" --instance ..\instances\live-acceptance
  --provider auto --max-queries 3 --max-fetches 3 --keep-instance --json
non_goals:
  - no key committed or pasted
  - no public exposure
  - no human product approval claim
  - no Agentic Hunt Planner work
next_recommended_task_on_pass: HUMAN-END-TO-END-ACCEPTANCE-00
