schema_version: aide.task.v0
id: EUREKA-REAL-LIVE-SEARCH-HUNT-00
title: Make Eureka provide real live search and Hunt before acceptance
status: PASS_WITH_WARNINGS
task_class: product_vertical_slice
parent_track: E2E-REFERENCE-SYSTEM-TRACK-00
supersedes:
  - EUREKA-REAL-LOCAL-SEARCH-HUNT-00
predecessor: EUREKA-FIRST-RUN-ACCEPTANCE-UX-00
successor: HUMAN-END-TO-END-ACCEPTANCE-00
purpose: >-
  Replace the local-only fixture/demo acceptance path with a usable live
  discovery product path: arbitrary query, immediate live web leads, deeper
  Hunt, safe inspection, local Preview Index persistence, restart, and local
  search.
operator_verdict_source: prompt:2026-06-20-real-live-search-reset
allowed_scope:
  - README.md
  - docs/STATUS.md
  - docs/ROADMAP.md
  - .aide/queue/index.yaml
  - .aide/queue/EUREKA-REAL-LIVE-SEARCH-HUNT-00/**
  - .aide/context/**
  - scripts/eureka.py
  - runtime/search/**
  - runtime/local/**
  - runtime/index/**
  - runtime/resolution_run/**
  - runtime/engine/interfaces/**
  - surfaces/web/**
  - contracts/**
  - tests/e2e/**
  - tests/runtime/**
  - tests/integration/**
  - tests/scripts/**
  - docs/operations/**
  - docs/reference/**
  - control/audits/e2e_reference_system/**
  - control/inventory/**
forbidden_scope:
  - raw provider credentials, API keys, local caches, raw prompt logs, raw responses, and source AIDE repository state
  - public exposure, tunnel activation, deployment, or launch implementation
  - reviewed/master/public truth mutation
  - review decision recording
  - production review stores
  - downloads or execution outside the safe fetch milestone
  - broad provider-family expansion before the brokered broad-web plus IA path is useful
  - model/agentic planner work before deterministic Hunt works
live_network_authorization:
  status: authorized_for_bounded_local_operator_opt_in
  provider_family: broad_web_search
  first_provider: approved_broad_web_provider
  credential_env:
    - BRAVE_SEARCH_API_KEY
    - BRAVE_API_KEY
    - MOJEEK_SEARCH_API_KEY
    - MOJEEK_API_KEY
  constraints:
    - provider calls require explicit --live mode or live server mode
    - never print, persist, commit, or expose provider credentials
    - enforce request budgets and bounded retry/backoff
    - do not persist provider-restricted snippets, ranks, or raw responses under standard terms
    - public exposure remains forbidden
provider_retention_policy:
  brave_standard_terms_default:
    display_results: true
    transient_cache_ttl: bounded_operational_only
    persist_urls: false
    persist_snippets: false
    persist_rank: false
    redistribute: false
    use_for_model_training: false
  persistent_source: independently_fetched_policy_approved_source_observations
milestones:
  - id: 1
    title: Remove synthetic behavior from normal mode
    acceptance:
      - fixture imports removed from production search path
      - hard-query fixture fallback removed from normal search
      - bootstrap defaults to no demo data
      - --with-demo becomes explicit
      - normal search never silently substitutes fixtures
  - id: 2
    title: Broad-web provider contract and Brave adapter
    acceptance:
      - provider-neutral search interface exists
      - Brave adapter reads key from local environment only
      - Brave results are transient SearchLeads with retention policy
      - rate-limit headers and HTTP 429 are handled with bounded retry/backoff
  - id: 3
    title: Immediate live result display
    acceptance:
      - local and live results can be blended
      - /, /search, /api/search, /hunt, and /api/hunt expose ordinary search/Hunt surfaces in live mode
      - no review packet language or raw JSON on the normal HTML page
  - id: 4
    title: Safe fetch and extraction
    acceptance:
      - search API lookup and page fetching are separate components
      - SSRF, redirect, DNS, robots, MIME, size, timeout, and concurrency limits are enforced
      - fetch errors are stored honestly
  - id: 5
    title: Persistent Preview Index
    acceptance:
      - PreviewIndexStore port exists
      - SQLite/FTS adapter persists policy-approved SourceObservations
      - restart preserves indexed unreviewed discoveries
  - id: 6
    title: Real Hunt
    acceptance:
      - deterministic query expansion, pagination, archive variants, outbound-link following, dedupe, budgets, and cancellation work
      - visible Hunt responses show transient unresolved leads while persisted summaries show only attempted queries, providers, pages fetched, unique counts, duplicates, blocked fetches, errors, near misses, and observation refs
milestone_evidence:
  milestone_1: pass
  milestone_2: pass
  milestone_3: pass
  milestone_4: pass
  milestone_5: pass
  milestone_6: pass
  notes:
    - normal search no longer substitutes hard-query fixtures
    - bootstrap defaults to no demo data
    - broad-web provider contracts exist with provider-specific transient retention policy
    - live CLI/server display paths exist but real fetch, durable indexing, and full Hunt remain incomplete
    - safe fetch/extraction and SourceObservation persistence components exist with SSRF, DNS, redirect, robots, MIME, body-size, URL-credential, HTTP-error, per-host budget, and durable-store tests
    - SQLite/FTS operational Preview Index persists independently fetched SourceObservations and restart search/export/rollback proof passes
    - deterministic Hunt engine paginates provider results, fetches selected leads, follows bounded outbound links, indexes observations, records sanitized events, and supports pause/resume/cancel state
    - live Search/Hunt UX exposes normal search, Hunt progress, and result inspection without task IDs, review-packet language, or raw JSON on normal pages
    - real end-to-end live canary harness is implemented but waiting for a healthy approved broad-web provider before this track can close
    - second-provider conformance is implemented with broad-web plus Internet Archive metadata but remains live-acceptance-gated
    - Autonomous Index Foundry v0 is implemented but disabled by default and waiting for live acceptance before optional live runs
    - live discovery stack audit reports zero critical and zero high findings, with medium findings limited to external live canary and live-activation gates
acceptance_gate:
  status: WAITING_FOR_DISCOVERY_BROKER_LIVE_CANARY
  task: EUREKA-REAL-LIVE-SEARCH-HUNT-ACCEPTANCE-01
  reason: no healthy approved broad-web provider is configured in the current environment
  required_proof:
    - live provider configured
    - live result count >= 1
    - Hunt queries attempted >= 1
    - fetch attempts >= 1
    - pages fetched >= 1
    - SourceObservations created >= 1
    - Preview documents indexed >= 1
    - SQLite store close/reopen local search hits >= 1
    - provider payload persisted is false
    - reviewed/public mutation is false
subdeliverables:
  retention_and_state_hotfix:
    status: pass
    acceptance:
      - no Brave URL, snippet, rank, or raw response is written to Hunt summary artifacts
      - CLI and HTTP provider calls route through runtime/search/live_service.py
      - duplicate accounting tracks raw transient leads separately from unique display leads
      - docs and AIDE memory distinguish local --live opt-in provider calls from public fanout
  safe_fetch_component:
    status: pass
    acceptance:
      - runtime/connectors/web safe fetcher validates scheme, port, DNS, redirects, robots, MIME, and body size before producing SourceObservation output
      - tests prove private/local targets and private redirects are blocked before transport
      - tests prove provider SearchLead payloads are not part of durable fetch contracts
      - durable SourceObservation records can be persisted locally without provider result payloads
deliverables:
  - python scripts/eureka.py serve --live
  - python scripts/eureka.py search "<arbitrary query>" --live
  - python scripts/eureka.py hunt "<arbitrary query>" --live --max-queries 20 --max-fetches 10
  - python scripts/eureka.py search "<known local query>" --index local
  - python scripts/eureka.py index stats
acceptance:
  - Human acceptance can resume only after all six milestones pass with an unseen human-chosen query.
  - Live unreviewed results must display without review.
  - Local private unreviewed indexing must work without canonical promotion.
  - Fixture data must not appear in normal live/local search unless replay, tests, or explicit demo mode requested it.
  - Provider failure must be honest and local search must remain usable.
validation:
  - fixture-free production path test
  - provider adapter contract tests
  - live-provider opt-in canary
  - immediate-result route test
  - safe-fetch SSRF suite
  - robots-policy tests
  - persistent Preview Index restart test
  - Hunt budget/cancellation tests
  - deduplication tests
  - provider outage test
  - no reviewed/public mutation test
proof_level_required: L3
