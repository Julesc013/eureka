id: H14-BUNDLE-03
title: Source discovery, source packs, coverage manifests, and scorecard dry-run rollups
status: queued
track: H14
recommended_after: H14-BUNDLE-02
goal: Add policy-gated H14 Source OS rollup dry-runs from fixture-equivalent outputs without opening live source discovery, pack movement, registry mutation, or truth acceptance.
allowed_scope_summary: H14 dry-run contracts, policies, committed request manifests, wrappers, examples, docs, tests, audit pack, and AIDE metadata only until explicitly scoped.
gate: H14-BUNDLE-02 passes and recommends H14-BUNDLE-03.
no_goals:
