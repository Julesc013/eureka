schema_version: aide.task.v0
id: OPERATOR-LIVE-CANARY-00
title: Run the real end-to-end live Search/Hunt canary with a local Brave key
status: WAITING_FOR_OPERATOR_LIVE_CANARY
task_class: operator_live_gate
parent_track: EUREKA-REAL-LIVE-SEARCH-HUNT-00
predecessor: EUREKA-LIVE-DISCOVERY-STACK-AUDIT-01
successor: HUMAN-END-TO-END-ACCEPTANCE-00
purpose: >-
  Have the local operator supply BRAVE_SEARCH_API_KEY or BRAVE_API_KEY outside
  Git/chat and run the strengthened real canary through live Search, Hunt,
  independent safe fetch, SourceObservation creation, SQLite Preview Index
  insertion, store reopen, and local search retrieval.
required_command: >-
  python scripts/check_live_search_hunt_acceptance.py --live-canary --query
  "<operator unseen query>" --instance ..\instances\live-acceptance
  --max-queries 3 --max-fetches 3 --keep-instance --json
completion_requires:
  - live_provider_configured true
  - live_result_count >= 1
  - queries_attempted >= 1
  - transient_lead_count >= 1
  - fetch_attempt_count >= 1
  - pages_fetched >= 1
  - observations_created >= 1
  - documents_indexed >= 1
  - restart_local_search_hits >= 1
  - provider_result_payload_persisted false
  - reviewed_master_mutation false
  - public_index_mutation false
non_goals:
  - no key committed or pasted
  - no public exposure
  - no human product approval claim
  - no Agentic Hunt Planner work
