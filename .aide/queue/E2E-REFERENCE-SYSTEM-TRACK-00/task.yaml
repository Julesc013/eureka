      - ResolutionRun
      - Hunt
      - WorkUnit scheduling
      - provider ports
      - budgets and timeouts
      - pause resume cancel
      - replay
      - retry and partial failure
  - name: Evidence
    responsibilities:
      - SourceObservation
      - EvidenceSummary
      - provenance
      - source locators
      - conflict state
      - unavailability
      - absence
      - near misses
  - name: Preview
    responsibilities:
      - reviewed projections
      - candidates
      - near misses
      - needs
      - absences
      - blocked states
      - unavailable states
      - unknown states
      - status-aware search and ranking
      - why-this-matched explanations
  - name: Truth
    responsibilities:
      - ReviewItem
      - ReviewDecision
      - Review Ledger
      - ReviewedRecord
      - supersession
      - accepted local delta
      - review lineage
  - name: Distribution
    responsibilities:
      - local indexes
      - snapshots
      - relay
      - API
      - CLI
      - web
      - text classic HTML
      - native projections
      - agent-context packets
  - name: Control and Observability
    responsibilities:
      - AIDE
      - queue and task authority
      - policy
      - run events
      - health
      - metrics
      - validation
      - audit
      - release gates
      - rollback
      - incident posture
cross_plane_invariant: Discovery may propose; Evidence may support; Preview may project; Review may decide; Truth may materialize; Distribution may publish permitted projections; Control may constrain and verify.
