  - historical_queue_expectation_drift
  - historical_validator_drift
  - stale_fixture_or_golden
  - environment_or_harness_error
  - test_isolation_or_order_dependency
  - obsolete_test_candidate
  - unknown_requires_investigation
acceptance:
  - Compare the repeated red full-discovery evidence without running another unchanged full-discovery pass.
  - Inventory every failed/error test from available compact artifacts and logs.
  - Classify failures from assertion signatures and current repo authority, not by filename alone.
  - Repair only evidence-backed drift or proven regressions, with targeted tests for each changed group.
  - Keep public exposure paused and reviewed truth/index mutation forbidden.
  - Prepare a new external full-discovery handoff only if targeted lanes are green and no genuine or unknown blocker remains.
  - Keep dev-to-main promotion blocked until a later returned external rerun is green.
proof_level_required: L1
