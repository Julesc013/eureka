id: H14-BUNDLE-02
title: Source discovery, source packs, coverage manifests, and scorecard fixture runtimes
status: queued
track: H14
recommended_after: H14-BUNDLE-01
goal: Normalize committed synthetic H14 SourceNeed, SourceCandidate, source-pack, coverage, scorecard, reliability/freshness, dispute/revocation, lineage, and pack-boundary fixtures without opening source discovery.
allowed_scope_summary: H14 fixture contracts, committed fixtures, normalizers, scripts, examples, docs, tests, audit pack, and AIDE metadata only until explicitly scoped.
gate: H14-BUNDLE-01 passes and recommends H14-BUNDLE-02.
no_goals:
  - no live source calls, web search, crawling, scraping, source sync, or connector runtime access by default
  - no network/API/model/provider calls
  - no local/private/user-supplied/authenticated/restricted access
  - no pack import/export/signing/publication/acceptance
  - no source or connector registry mutation
  - no source-cache, evidence, review queue, public-index, or master-index writes
  - no source/candidate/coverage/scorecard/reliability/freshness/dispute/revocation/lineage/pack truth acceptance
