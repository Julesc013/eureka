schema_version: aide.commit-message-policy.v0
policy_id: eureka-commit-message-standard-v0
status: active
purpose: >
  Require changelog-ready Git commit messages for AIDE-managed Eureka work so
  future tooling can compile release notes and task history from commit bodies.
standard: Conventional Commits with structured Markdown body
subject:
  format: "type(scope): summary"
  subject_max_chars: 72
  allowed_types:
    - aide
    - audit
    - chore
    - connectors
    - contracts
    - docs
    - eval
    - feat
    - fix
    - native
    - ops
    - refactor
    - revert
    - runtime
    - security
    - site
    - surface
    - test
  summary_rule: specific outcome, imperative or present-tense, no trailing period
  forbidden_vague_summaries:
    - update
    - changes
    - misc
    - wip
body:
  markdown_required: true
  required_body_headings:
    - "## Summary"
    - "## Why"
    - "## Changed"
    - "## Validation"
    - "## Changelog"
    - "## Risks"
    - "## Follow-up"
  validation_result_tokens:
    - PASS
    - WARN
    - FAIL
    - NOT RUN
  changelog_categories:
    - Added
    - Changed
    - Fixed
    - Removed
    - Deprecated
    - Security
    - Docs
    - Tests
    - Internal
    - Risks
    - Follow-up
automation:
  checker_command: "py -3 .aide/scripts/aide_lite.py commit check --message-file <path>"
  latest_commit_check: "py -3 .aide/scripts/aide_lite.py commit check --latest"
  range_check: "py -3 .aide/scripts/aide_lite.py commit check --range <base>..HEAD"
  install_hook: "py -3 .aide/scripts/aide_lite.py commit install-hook"
  hook_template: ".aide/hooks/commit-msg"
  local_hook_path: ".aide/hooks/commit-msg"
  local_hook_config: "core.hooksPath=.aide/hooks"
non_goals:
  - no network calls
  - no provider calls
  - no automatic release publishing
  - no exact semantic changelog classification
